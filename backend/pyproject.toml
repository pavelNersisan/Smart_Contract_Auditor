[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-contract-auditor"
version = "1.0.0"
description = "Static analysis and risk scoring for Solidity contracts"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
slither = ["slither-analyzer>=0.10"]
mythril = ["mythril>=0.24"]

[project.scripts]
auditor = "app.cli:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.j2"]

# pytest is configured at the repository root (pytest.ini), not here, because
# the tests live outside the package directory.
